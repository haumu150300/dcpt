name: NAFNet_5d
suffix: ~  # add suffix to saved images
model_type: SRModel
scale: 1
crop_border: 0  # crop border when evaluation. If None, crop the scale pixels
num_gpu: 1  # set num_gpu: 0 for cpu mode
manual_seed: 0

# dataset and data loader settings
datasets:
  test_1:
    name: val_img
    type: PairedImageDataset
    # dataroot_lq: /content/drive/MyDrive/Collab_storage/img_restoration/val_LQ/LQ
    dataroot_gt: I:\learning\aivn\vlm\image_restoration\foundir\dataset\Val_LQ\LQ
    dataroot_lq: I:\learning\aivn\vlm\image_restoration\foundir\dataset\Val_LQ\LQ
    io_backend:
      type: disk

hook_names: decoder

# network structures
network_g:
  type: NAFNetBaseline
  width: 64
  enc_blk_nums: [1, 1, 1, 28]
  middle_blk_num: 1
  dec_blk_nums: [1, 1, 1, 1]
  window_size: 16 

network_dc:
  type: PromptIR_NoImg_DC
  feature_dims: [64, 128, 256, 512]
  num_classes: 5

path:
  pretrain_blurnet_g_latest: pretrained_models/blurnet_g_latest.pth
  pretrain_hazenet_g_latest: pretrained_models/hazenet_g_latest.pth
  pretrain_rainnet_g_latest: pretrained_models/rainnet_g_latest.pth
  pretrain_snownet_g_latest: pretrained_models/snownet_g_latest.pth
  pretrain_lowlightnet_g_latest: pretrained_models/lowlightnet_g_latest.pth
  pretrain_netg_dc_latest: pretrained_models/net_g_182000.pth
  pretrain_network_dc: pretrained_models/net_dc_178000.pth
  param_key_g: params_ema
  strict_load_g: true
  resume_state: ~
 

# validation settings
val:
  save_img: true
  suffix: ~  # add suffix to saved images, if None, use exp name

  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
      image_range: 255.0
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false
      image_range: 255.0
