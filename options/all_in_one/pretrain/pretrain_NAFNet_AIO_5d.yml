# general settings
name: pretrain_NAFNet_all_in_one_derain_denoise_dehaze_lowlight_deblur
model_type: DCPTModel
scale: 1
num_gpu: auto  # set num_gpu: 0 for cpu mode
manual_seed: 0
classify: true

# dataset and data loader settings
datasets:
  train_1:
    name: Deblur
    type: PairedImageDataset
    dataroot_gt: train_data/Blur/GT
    dataroot_lq: train_data/Blur/LQ
    io_backend:
      type: disk
    gt_size: 128
    use_hflip: true
    use_rot: true
    dataset_enlarge_ratio: 1
  train_2:
    name: Dehaze
    type: PairedImageDataset
    dataroot_gt: train_data/Haze/GT
    dataroot_lq: train_data/Haze/LQ
    io_backend:
      type: disk
    gt_size: 128
    use_hflip: true
    use_rot: true
    # sigma_type: choice for noise 
    # sigma_range: [15, 25, 50]
  train_3:
    name: Delowlight
    type: PairedImageDataset
    dataroot_gt: train_data/Lowlight/GT
    dataroot_lq: train_data/Lowlight/LQ
    io_backend:
      type: disk
    gt_size: 128
    use_hflip: true
    use_rot: true
  train_4:
    name: DeRain
    type: PairedImageDataset
    dataroot_gt: train_data/Rain/GT
    dataroot_lq: train_data/Rain/LQ
    io_backend:
      type: disk
    gt_size: 128
    use_hflip: true
    use_rot: true
    # dataset_enlarge_ratio: 10
  train_5:
    name: DeSnow
    type: PairedImageDataset
    dataroot_gt: train_data/Snow/GT
    dataroot_lq: train_data/Snow/LQ
    io_backend:
      type: disk
    gt_size: 128
    use_hflip: true
    use_rot: true

  val_1:
    name: Val_Blur
    type: PairedImageDataset
    dataroot_gt: train_data/Snow/GT
    dataroot_lq: train_data/Snow/LQ
    io_backend:
      type: disk
    num_worker_per_gpu: 1
    batch_size_per_gpu: 1
    center_crop: 256
  val_2:
    name: Val_Haze
    type: PairedImageDenoiseDataset
    dataroot_gt: train_data/Snow/GT
    dataroot_lq: train_data/Snow/LQ
    io_backend:
      type: disk
    sigma_type: constant
    sigma_range: 25
    num_worker_per_gpu: 1
    batch_size_per_gpu: 1
    center_crop: 256
  val_3:
    name: Val_Lowlight
    type: PairedImageDataset
    dataroot_gt: train_data/Snow/GT
    dataroot_lq: train_data/Snow/LQ
    io_backend:
      type: disk
    suffix: .png
    num_worker_per_gpu: 1
    batch_size_per_gpu: 1
    center_crop: 256
  val_4:
    name: Val_Rain
    type: PairedImageDataset
    dataroot_gt: train_data/Snow/GT
    dataroot_lq: train_data/Snow/LQ
    io_backend:
      type: disk
    num_worker_per_gpu: 1
    batch_size_per_gpu: 1
    center_crop: 256
  val_5:
    name: Val_Snow
    type: PairedImageDataset
    dataroot_gt: train_data/Snow/GT
    dataroot_lq: train_data/Snow/LQ
    io_backend:
      type: disk
    num_worker_per_gpu: 1
    batch_size_per_gpu: 1
    center_crop: 256

dataloader:
  phase: train
  use_shuffle: true
  num_worker_per_gpu: 2
  batch_size_per_gpu: 8
  dataset_enlarge_ratio: 1
  prefetch_mode: ~
  pin_memory: true

dataloader_val:
  phase: val
  use_shuffle: false
  num_worker_per_gpu: 1
  batch_size_per_gpu: 1
  dataset_enlarge_ratio: 1
  prefetch_mode: ~
  pin_memory: true

# network structures
network_g:
  type: NAFNet
  width: 64
  enc_blk_nums: [1, 1, 1, 28]
  middle_blk_num: 1
  dec_blk_nums: [1, 1, 1, 1]
  window_size: 8

find_unused_parameters: false

hook_names: decoder

network_dc:
  type: PromptIR_NoImg_DC
  feature_dims: [64, 128, 256, 512]
  num_classes: 5

path:
  pretrain_network_g: ~
  strict_load_g: false
  resume_state: ~

# training settings
train:
  ema_decay: 0.999
  optim_g:
    type: AdamW
    lr: !!float 3e-4
    weight_decay: 0
    betas: [0.9, 0.999]
  optim_dc:
    type: AdamW
    lr: !!float 1e-4
    weight_decay: !!float 1e-4
    betas: [0.9, 0.999]

  scheduler:
    type: CosineAnnealingRestartLR
    periods: [1000000]
    restart_weights: [1]
    eta_min: !!float 1e-6

  total_iter: 1000000  # 1000 epoch 1 nnproc
  warmup_iter: -1  # no warm up

  # losses
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean
  classify_opt:
    type: FocalLoss
    gamma: 2.0

# validation settings
# val:
#   val_freq: !!float 2e4
#   save_img: false

#   metrics:
#     psnr:
#       type: calculate_psnr
#       crop_border: 0
#       test_y_channel: true
#       image_range: 255.0
#     ssim:
#       type: calculate_ssim
#       crop_border: 0
#       test_y_channel: true
#       image_range: 255.0

# logging settings
logger:
  print_freq: 100
  save_checkpoint_freq: !!float 2e4
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29500
