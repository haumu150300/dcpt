#       image_range: 255.0
#     ssim:
#       type: calculate_ssim
#       crop_border: 0
#       test_y_channel: false
#       image_range: 255.0

# logging settings
logger:
  print_freq: 100
  save_checkpoint_freq: !!float 1e4
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29500
