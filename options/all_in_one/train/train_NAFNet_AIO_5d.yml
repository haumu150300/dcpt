dataloader:
  phase: train
  use_shuffle: true
  num_worker_per_gpu: 2
  batch_size_per_gpu: 4
  dataset_enlarge_ratio: 1
  prefetch_mode: ~
  pin_memory: true

# network structures
network_g:
  type: NAFNet
  width: 64
  enc_blk_nums: [1, 1, 1, 28]
  middle_blk_num: 1
  dec_blk_nums: [1, 1, 1, 1]
  window_size: 8

find_unused_parameters: false

path:
  # pretrain_network_g: dcpt_nafnet_pretrain_5d.pth
  pretrain_network_g: ~
  strict_load_g: false
  resume_state: ~

grad_clip: 0.01

# training settings
train:
  ema_decay: 0.999
  optim_g:
    type: AdamW
    lr: !!float 3e-4
    weight_decay: 0
    betas: [0.9, 0.999]

  scheduler:
    type: CosineAnnealingRestartLR
    periods: [100000]
    restart_weights: [1]
    eta_min: !!float 1e-6

  total_iter: 100000  # 1000 epoch 1 nnproc
  warmup_iter: -1  # no warm up

  # losses
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean

# validation settings
# val:
